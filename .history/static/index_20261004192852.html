<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tale Trove Island: Multi-User SEND Learning</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Verdana&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Fredoka", "sans-serif"],
              dyslexia: ["Verdana", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      .bounce-hover:hover {
        transform: scale(1.03);
        transition: transform 0.2s ease;
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-8px);
        }
      }
      .floating {
        animation: float 3s ease-in-out infinite;
      }
      .dyslexia-spacing {
        letter-spacing: 0.08em;
        word-spacing: 0.15em;
        line-height: 1.8;
      }
    </style>
  </head>
  <body
    id="body-root"
    class="bg-gradient-to-br from-indigo-950 via-purple-950 to-pink-950 min-h-screen text-white font-sans flex flex-col items-center justify-between p-4 select-none transition-colors duration-300"
  >
    <!-- Top Navigation Bar -->
    <header
      class="w-full max-w-4xl bg-white/10 backdrop-blur-md rounded-2xl p-4 flex justify-between items-center shadow-xl border border-white/20"
    >
      <div
        class="flex items-center gap-3 cursor-pointer"
        onclick="goToProfiles()"
      >
        <span class="text-3xl">🏝️</span>
        <div>
          <h1
            class="text-xl font-bold tracking-wide bg-gradient-to-r from-yellow-300 via-pink-300 to-teal-300 bg-clip-text text-transparent"
          >
            Tale Trove Island
          </h1>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button
          onclick="goToProfiles()"
          class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1"
          title="Switch Explorer Profile"
        >
          👤 <span id="current-user-badge">Select Profile</span>
        </button>
        <button
          onclick="openSendSettings()"
          class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full text-xs font-bold"
          title="SEND Settings"
        >
          🧠 SEND
        </button>
        <div
          class="bg-yellow-400/20 border border-yellow-400 px-3 py-1 rounded-full flex items-center gap-1 text-yellow-300 font-bold text-sm"
        >
          <span>⭐</span> <span id="header-stars">0</span>
        </div>
        <button
          onclick="toggleAudio()"
          id="audio-btn"
          class="bg-white/20 hover:bg-white/30 p-2 rounded-full text-lg transition"
          title="Toggle Music"
        >
          🎵
        </button>
      </div>
    </header>

    <!-- Main Content Dynamic Container -->
    <main
      id="app-container"
      class="w-full max-w-4xl my-6 flex-1 flex flex-col items-center justify-center"
    >
      <!-- Injected via JavaScript Views -->
    </main>

    <!-- Footer Security & Privacy Badge -->
    <footer
      class="w-full max-w-4xl text-center text-xs text-white/50 py-2 border-t border-white/10 flex justify-between items-center"
    >
      <span>🔒 100% Local & Private (Multi-Classmate Profile Support)</span>
      <span id="dialect-footer-badge">Dialect: UK 🇬🇧</span>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
      let state = {
        view: "profile_select",
        profiles: [],
        activeProfileId: null,
        profile: {
          id: null,
          name: "Superstar",
          year_group: 3,
          stars: 0,
          streak_days: 0,
          avatar_config: {},
          dialect: "UK",
          theme_mode: "pastel",
          dyslexia_font: false,
        },
        inventory: [],
        world_objects: [],
        stories: [],
        practice: {
          level: "medium",
          session_length: 10,
          questions: [],
          currentIndex: 0,
          correctCount: 0,
          timer: 30,
          timerInterval: null,
          needMoreTimeTriggered: false,
        },
        wordGame: {
          wordsUK: [
            { word: "COLOUR", hint: "Red, blue, yellow and green 🎨" },
            { word: "COLOURFUL", hint: "Bright and vibrant shades ✨" },
            { word: "FAVOURITE", hint: "The one you like the most ⭐" },
            { word: "CENTRE", hint: "The middle of anything 🎯" },
            { word: "PROGRAMME", hint: "A show on TV or schedule 📺" },
            { word: "ORGANISER", hint: "Keeps things neat and tidy 🗂️" },
          ],
          wordsUS: [
            { word: "COLOR", hint: "Red, blue, yellow and green 🎨" },
            { word: "COLORFUL", hint: "Bright and vibrant shades ✨" },
            { word: "FAVORITE", hint: "The one you like the most ⭐" },
            { word: "CENTER", hint: "The middle of anything 🎯" },
            { word: "PROGRAM", hint: "A show on TV or schedule 📺" },
            { word: "ORGANIZER", hint: "Keeps things neat and tidy 🗂️️" },
          ],
          currentIndex: 0,
          correctCount: 0,
          currentPet: "🐰",
          activeWord: "",
          guessedLetters: [],
          wrongAttempts: 0,
        },
        audioMuted: true,
        audioCtx: null,
        bgMusicInterval: null,
      };

      function speakText(text) {
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.rate = 0.9;
          utterance.pitch = 1.1;
          window.speechSynthesis.speak(utterance);
        }
      }

      function initAudio() {
        if (!state.audioCtx) {
          state.audioCtx = new (
            window.AudioContext || window.webkitAudioContext
          )();
        }
      }

      function playSound(type) {
        try {
          initAudio();
          const ctx = state.audioCtx;
          if (ctx.state === "suspended") ctx.resume();

          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          const now = ctx.currentTime;

          if (type === "correct") {
            osc.type = "triangle";
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.setValueAtTime(659.25, now + 0.1);
            osc.frequency.setValueAtTime(880, now + 0.2);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
          } else if (type === "wrong") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.setValueAtTime(250, now + 0.15);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
          } else if (type === "click") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(500, now);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc.start(now);
            osc.stop(now + 0.08);
          }
        } catch (e) {}
      }

      function toggleAudio() {
        state.audioMuted = !state.audioMuted;
        const btn = document.getElementById("audio-btn");
        if (!state.audioMuted) {
          btn.textContent = "🔊";
          startBgMusic();
        } else {
          btn.textContent = "🎵";
          stopBgMusic();
        }
      }

      function startBgMusic() {
        initAudio();
        if (state.bgMusicInterval) clearInterval(state.bgMusicInterval);
        const notes = [261.63, 329.63, 392.0, 523.25];
        let i = 0;
        state.bgMusicInterval = setInterval(() => {
          if (state.audioMuted) return;
          try {
            const ctx = state.audioCtx;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(
              notes[i % notes.length],
              ctx.currentTime,
            );
            gain.gain.setValueAtTime(0.03, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(
              0.001,
              ctx.currentTime + 0.5,
            );
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.5);
            i++;
          } catch (e) {}
        }, 1000);
      }

      function stopBgMusic() {
        if (state.bgMusicInterval) clearInterval(state.bgMusicInterval);
      }

      async function loadProfiles() {
        try {
          const res = await fetch("/api/profiles");
          state.profiles = await res.json();
          if (state.profiles.length > 0 && !state.activeProfileId) {
            selectProfile(state.profiles[0].id);
          } else if (state.profiles.length === 0) {
            state.view = "profile_select";
            renderView();
          }
        } catch (e) {
          console.error("Failed to load profiles", e);
        }
      }

      async function selectProfile(id) {
        state.activeProfileId = id;
        try {
          const res = await fetch(`/api/profile/${id}`);
          const data = await res.json();
          state.profile = data.profile;
          state.inventory = data.inventory;
          state.world_objects = data.world_objects;
          state.stories = data.stories;
          updateHeader();
          applyThemeAndDialect();
          setView("landing");
        } catch (e) {
          console.error("Failed to select profile", e);
        }
      }

      async function createNewProfilePrompt() {
        const name = prompt("Enter your explorer / classmate name:");
        if (!name) return;
        const yg = prompt("Enter your school year (2 to 6):", "3");
        if (!yg) return;

        try {
          const res = await fetch("/api/profiles/create", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: name.trim(),
              year_group: parseInt(yg) || 3,
              dialect: "UK",
              theme_mode: "pastel",
              dyslexia_font: false,
            }),
          });
          const newProf = await res.json();
          await loadProfiles();
          selectProfile(newProf.id);
        } catch (e) {
          alert("Failed to create profile");
        }
      }

      function updateHeader() {
        document.getElementById("header-stars").textContent =
          state.profile.stars;
        document.getElementById("current-user-badge").textContent =
          state.profile.name;
        document.getElementById("dialect-footer-badge").textContent =
          state.profile.dialect === "UK" ? "Dialect: UK 🇬🇧" : "Dialect: US 🇺🇸";
      }

      function applyThemeAndDialect() {
        const root = document.getElementById("body-root");
        if (state.profile.theme_mode === "pastel") {
          root.className =
            "bg-gradient-to-br from-slate-900 via-teal-950 to-indigo-950 min-h-screen text-slate-100 font-sans flex flex-col items-center justify-between p-4 select-none transition-colors duration-300";
        } else {
          root.className =
            "bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-900 min-h-screen text-white font-sans flex flex-col items-center justify-between p-4 select-none transition-colors duration-300";
        }

        if (state.profile.dyslexia_font) {
          root.classList.add("font-dyslexia", "dyslexia-spacing");
        } else {
          root.classList.remove("font-dyslexia", "dyslexia-spacing");
        }
      }

      function goToProfiles() {
        state.view = "profile_select";
        loadProfiles();
        renderView();
      }

      function showDashboardOrLanding() {
        if (state.view === "landing") {
          renderView();
        } else {
          setView("dashboard");
        }
      }

      function renderView() {
        const container = document.getElementById("app-container");
        container.innerHTML = "";
        playSound("click");

        if (state.view === "profile_select") {
          container.innerHTML = renderProfileSelectScreen();
        } else if (state.view === "landing") {
          container.innerHTML = renderLandingScreen();
        } else if (state.view === "dashboard") {
          container.innerHTML = renderDashboard();
        } else if (state.view === "practice") {
          container.innerHTML = renderPracticeScreen();
          startPracticeTimer();
        } else if (state.view === "wordgame") {
          container.innerHTML = renderWordGameScreen();
        } else if (state.view === "stories") {
          container.innerHTML = renderStoriesScreen();
        } else if (state.view === "writer") {
          container.innerHTML = renderStoryWriterScreen();
        } else if (state.view === "wardrobe") {
          container.innerHTML = renderWardrobeScreen();
        } else if (state.view === "world") {
          container.innerHTML = renderWorldBuilderScreen();
        } else if (state.view === "challenge") {
          container.innerHTML = renderChallengeScreen();
        }
      }

      function setView(v) {
        if (state.view === "practice" && state.practice.timerInterval) {
          clearInterval(state.practice.timerInterval);
        }
        state.view = v;
        renderView();
      }

      function renderProfileSelectScreen() {
        return `
                <div class="bg-white/10 backdrop-blur-xl border border-white/20 p-8 rounded-3xl shadow-2xl max-w-xl w-full flex flex-col gap-6 text-center animate-fadeIn">
                    <span class="text-6xl floating">🎒✨</span>
                    <h2 class="text-3xl font-extrabold text-yellow-300">Who is playing today?</h2>
                    <p class="text-white/80 text-sm">Select your name or create a new profile to track your stars and stories!</p>

                    <div class="grid grid-cols-1 gap-3 max-h-60 overflow-y-auto pr-1">
                        ${state.profiles
                          .map(
                            (p) => `
                            <button onclick="selectProfile(${p.id})" class="bg-white/20 hover:bg-white/30 border border-white/30 p-4 rounded-2xl flex justify-between items-center shadow-lg transition bounce-hover text-left">
                                <div class="flex items-center gap-3">
                                    <span class="text-3xl">🐵</span>
                                    <div>
                                        <h4 class="font-bold text-lg text-yellow-200">${p.name}</h4>
                                        <p class="text-xs text-white/70">Year ${p.year_group} • ⭐ ${p.stars} Stars</p>
                                    </div>
                                </div>
                                <span class="bg-emerald-500 text-white px-4 py-2 rounded-xl text-sm font-bold shadow">Play! 🚀</span>
                            </button>
                        `,
                          )
                          .join("")}
                    </div>

                    <button onclick="createNewProfilePrompt()" class="bg-gradient-to-r from-teal-500 to-cyan-500 hover:scale-105 text-white font-extrabold py-4 rounded-2xl shadow-xl transition text-lg mt-2">
                        + Create New Classmate Profile 🌟
                    </button>
                </div>
            `;
      }

      function openSendSettings() {
        const p = state.profile;
        const container = document.getElementById("app-container");
        container.innerHTML = `
                <div class="bg-white/15 backdrop-blur-xl border border-white/20 p-8 rounded-3xl shadow-2xl max-w-lg w-full flex flex-col gap-6 animate-fadeIn">
                    <div class="flex justify-between items-center">
                        <h2 class="text-3xl font-extrabold text-yellow-300">🧠 SEND & Accessibility</h2>
                        <button onclick="setView('dashboard')" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-xl text-sm font-bold">⬅️ Back</button>
                    </div>

                    <div class="flex flex-col gap-4 text-left">
                        <div class="bg-black/20 p-4 rounded-2xl border border-white/10">
                            <label class="block font-bold text-teal-300 mb-2">English Dialect (Spelling & Writing)</label>
                            <div class="grid grid-cols-2 gap-3">
                                <button onclick="saveSendPref('dialect', 'UK')" class="p-3 rounded-xl font-bold border-2 ${p.dialect === "UK" ? "bg-teal-600 border-teal-300 shadow-lg" : "bg-white/10 border-white/20"}">
                                    🇬🇧 British English
                                </button>
                                <button onclick="saveSendPref('dialect', 'US')" class="p-3 rounded-xl font-bold border-2 ${p.dialect === "US" ? "bg-teal-600 border-teal-300 shadow-lg" : "bg-white/10 border-white/20"}">
                                    🇺🇸 American English
                                </button>
                            </div>
                        </div>

                        <div class="bg-black/20 p-4 rounded-2xl border border-white/10">
                            <label class="block font-bold text-pink-300 mb-2">Sensory Theme (Autism / ADHD Friendly)</label>
                            <div class="grid grid-cols-2 gap-3">
                                <button onclick="saveSendPref('theme_mode', 'pastel')" class="p-3 rounded-xl font-bold border-2 ${p.theme_mode === "pastel" ? "bg-pink-600 border-pink-300 shadow-lg" : "bg-white/10 border-white/20"}">
                                    🌿 Cozy Pastel
                                </button>
                                <button onclick="saveSendPref('theme_mode', 'vibrant')" class="p-3 rounded-xl font-bold border-2 ${p.theme_mode === "vibrant" ? "bg-pink-600 border-pink-300 shadow-lg" : "bg-white/10 border-white/20"}">
                                    ✨ Vibrant Neon
                                </button>
                            </div>
                        </div>

                        <div class="bg-black/20 p-4 rounded-2xl border border-white/10 flex justify-between items-center">
                            <div>
                                <h4 class="font-bold text-yellow-300">Dyslexia-Friendly Font & Spacing</h4>
                                <p class="text-xs text-white/70">Increases letter spacing and legibility.</p>
                            </div>
                            <button onclick="saveSendPref('dyslexia_font', ${!p.dyslexia_font})" class="px-5 py-2.5 rounded-xl font-bold ${p.dyslexia_font ? "bg-emerald-600 text-white" : "bg-white/20 text-white/70"}">
                                ${p.dyslexia_font ? "ENABLED ✓" : "DISABLED"}
                            </button>
                        </div>
                    </div>
                </div>
            `;
      }

      async function saveSendPref(field, val) {
        state.profile[field] = val;
        try {
          await fetch(`/api/profile/${state.activeProfileId}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: state.profile.name,
              year_group: state.profile.year_group,
              dialect: state.profile.dialect,
              theme_mode: state.profile.theme_mode,
              dyslexia_font: state.profile.dyslexia_font,
            }),
          });
          applyThemeAndDialect();
          updateHeader();
          openSendSettings();
        } catch (e) {}
      }

      function renderLandingScreen() {
        const dialectLabel =
          state.profile.dialect === "UK"
            ? "British English 🇬🇧"
            : "American English 🇺🇸";
        return `
                <div class="flex flex-col items-center text-center gap-8 w-full max-w-2xl p-6 bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl shadow-2xl animate-fadeIn">
                    <div class="text-7xl floating">🏝️✨</div>
                    <h2 class="text-4xl font-extrabold bg-gradient-to-r from-yellow-300 via-pink-300 to-teal-300 bg-clip-text text-transparent">Welcome, ${state.profile.name}!</h2>
                    
                    <p class="text-xl text-white/90 leading-relaxed font-semibold">
                        Are you ready for Tale Trove Island where <span class="text-yellow-300">math turns to treasure, reading unlocks magic, and every story sparks an adventure?</span>
                    </p>

                    <div class="bg-black/20 px-4 py-2 rounded-xl border border-white/10 text-xs text-teal-300 font-semibold">
                        👤 Active Profile: ${state.profile.name} (Year ${state.profile.year_group}) • ${dialectLabel}
                    </div>

                    <div class="flex gap-4">
                        <button onclick="setView('dashboard')" class="bg-gradient-to-r from-yellow-400 via-pink-500 to-teal-400 hover:scale-105 text-gray-900 font-extrabold text-lg py-4 px-8 rounded-full shadow-2xl transition transform active:scale-95 border-2 border-white/40">
                            Start Adventure! 🚀
                        </button>
                        <button onclick="goToProfiles()" class="bg-white/20 hover:bg-white/30 font-bold py-4 px-6 rounded-full shadow-lg transition">
                            Switch Profile
                        </button>
                    </div>
                </div>
            `;
      }

      function renderDashboard() {
        const p = state.profile;
        return `
                <div class="flex flex-col items-center gap-8 w-full animate-fadeIn">
                    <div class="text-center flex justify-between items-center w-full px-4">
                        <button onclick="setView('landing')" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-xl text-xs font-bold">⬅️ Home</button>
                        <div>
                            <h2 class="text-3xl font-extrabold text-yellow-300 drop-shadow-md">Hello, ${p.name}! ✨</h2>
                            <p class="text-white/80 text-sm mt-1">What fun adventure would you like to explore today?</p>
                        </div>
                        <button onclick="goToProfiles()" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-xl text-xs font-bold">👤 Switch</button>
                    </div>

                    <div class="bg-white/10 backdrop-blur-xl border border-white/20 p-6 rounded-3xl shadow-2xl flex flex-col items-center gap-4 relative floating">
                        <div class="w-32 h-32 bg-gradient-to-tr from-brandYellow to-brandPink rounded-full flex items-center justify-center text-6xl shadow-lg border-4 border-white/30 relative">
                            🐵
                            <div class="absolute -top-2 -right-2 text-2xl">${getEquippedEmoji("hat")}</div>
                            <div class="absolute bottom-2 -left-2 text-2xl">${getEquippedEmoji("glasses")}</div>
                        </div>
                        <div class="text-center">
                            <span class="bg-white/20 px-3 py-1 rounded-full text-sm font-semibold">School Year ${p.year_group} Explorer (${p.dialect})</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-2xl">
                        <button onclick="startPracticeSetup()" class="bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 p-6 rounded-3xl shadow-xl flex items-center gap-5 bounce-hover border-2 border-emerald-300 text-left">
                            <span class="text-5xl bg-white/20 p-4 rounded-2xl">🎯</span>
                            <div>
                                <h3 class="text-2xl font-bold">Practice Timetables</h3>
                                <p class="text-emerald-100 text-sm">Gentle math practice & timers!</p>
                            </div>
                        </button>

                        <button onclick="startWordGame()" class="bg-gradient-to-r from-teal-500 to-cyan-600 hover:from-teal-400 hover:to-cyan-500 p-6 rounded-3xl shadow-xl flex items-center gap-5 bounce-hover border-2 border-teal-300 text-left">
                            <span class="text-5xl bg-white/20 p-4 rounded-2xl">📦</span>
                            <div>
                                <h3 class="text-2xl font-bold">Pet Box Word Game</h3>
                                <p class="text-teal-100 text-sm">Free the pets with spelling & reading!</p>
                            </div>
                        </button>

                        <button onclick="setView('stories')" class="bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-500 hover:to-rose-500 p-6 rounded-3xl shadow-xl flex items-center gap-5 bounce-hover border-2 border-pink-300 text-left">
                            <span class="text-5xl bg-white/20 p-4 rounded-2xl">📖</span>
                            <div>
                                <h3 class="text-2xl font-bold">Magical Story Creator</h3>
                                <p class="text-pink-100 text-sm">Write in ${p.dialect === "UK" ? "British" : "American"} English!</p>
                            </div>
                        </button>

                        <button onclick="setView('wardrobe')" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 p-6 rounded-3xl shadow-xl flex items-center gap-5 bounce-hover border-2 border-purple-300 text-left">
                            <span class="text-5xl bg-white/20 p-4 rounded-2xl">👕</span>
                            <div>

      function beginPractice(level, count) {
        state.practice.level = level;
        state.practice.session_length = count;
        state.practice.currentIndex = 0;
        state.practice.correctCount = 0;
        state.practice.timer =
          level === "easy" ? 0 : level === "medium" ? 25 : 12;
        state.practice.needMoreTimeTriggered = false;

        const yg = state.profile.year_group;
        let maxTable = yg === 2 ? 5 : yg === 3 ? 8 : 12;

        let questions = [];
        for (let i = 0; i < count; i++) {
          const a = Math.floor(Math.random() * maxTable) + 2;
          const b = Math.floor(Math.random() * 10) + 1;
          questions.push({ a, b, answer: a * b });
        }
        state.practice.questions = questions;
        state.view = "practice";
        renderView();
      }

      function renderPracticeScreen() {
        const pr = state.practice;
        if (pr.currentIndex >= pr.questions.length) {
          finishPracticeSession();
          return `<div class="text-center"><h2 class="text-3xl font-bold text-yellow-300 animate-bounce">🎉 Amazing Job! Saving your stars...</h2></div>`;
        }

        const q = pr.questions[pr.currentIndex];

        return `
                <div class="bg-white/10 backdrop-blur-xl border border-white/20 p-8 rounded-3xl shadow-2xl max-w-xl w-full flex flex-col items-center gap-6 relative">

                        <span>Question ${pr.currentIndex + 1} / ${pr.session_length}</span>
                        <div class="flex items-center gap-2">
                            <button onclick="speakText('${q.a} times ${q.b}')" class="bg-white/20 hover:bg-white/30 p-1.5 rounded-full text-sm" title="Read Aloud (TTS)">🔊 Listen</button>
                            ${pr.level !== "easy" ? `<div class="bg-red-500/20 border border-red-400 px-3 py-1 rounded-full text-red-300 flex items-center gap-1">⏱️ <span id="timer-display">${pr.timer}</span>s</div>` : ""}
                        </div>
                    </div>

                    <div class="bg-white/25 border-4 border-white/40 px-10 py-8 rounded-3xl shadow-2xl text-center w-full">
                        <span class="text-5xl font-extrabold tracking-wider text-yellow-200">${q.a} × ${q.b} = ?</span>
                    </div>

                    <div id="options-grid" class="grid grid-cols-2 gap-4 w-full">
                        ${generateOptions(q.answer)
                          .map(
                            (opt) => `
                            <button onclick="submitAnswer(${opt},${q.answer})" class="bg-white/20 hover:bg-white/30 border-2 border-white/30 p-5 rounded-2xl text-3xl font-bold shadow-lg transition transform active:scale-95">${opt}</button>
                        `,
                          )
                          .join("")}
                    </div>

                    <div id="gentle-modal" class="hidden absolute inset-0 bg-black/70 backdrop-blur-sm rounded-3xl flex flex-col items-center justify-center p-6 text-center animate-fadeIn">
                        <span class="text-5xl mb-3">🐱</span>
                        <h3 class="text-2xl font-bold text-yellow-300">Need a little extra time, superstar?</h3>
                        <p class="text-white/80 text-sm mt-1 mb-6">Take all the time you need! No rush here.</p>
                        <button onclick="addExtraTime()" class="bg-gradient-to-r from-yellow-400 to-amber-500 text-gray-900 font-extrabold px-6 py-3 rounded-full shadow-lg hover:scale-105 transition">Yes, give me +10 seconds! ⏰</button>
                    </div>
                </div>
            `;
      }

      function generateOptions(correct) {
        let opts = [correct];
        while (opts.length < 4) {
          let offset =
            (Math.random() < 0.5 ? 1 : -1) *
            (Math.floor(Math.random() * 5) + 1);
          let wrong = correct + offset;
          if (wrong > 0 && !opts.includes(wrong)) {
            opts.push(wrong);
          }
        }
        return opts.sort(() => Math.random() - 0.5);
      }

      function startPracticeTimer() {
        const pr = state.practice;
        if (pr.level === "easy") return;

        if (pr.timerInterval) clearInterval(pr.timerInterval);
        pr.timerInterval = setInterval(() => {
          pr.timer--;
          const timerEl = document.getElementById("timer-display");
          if (timerEl) timerEl.textContent = pr.timer;

          if (
            pr.timer === 5 &&
            !pr.needMoreTimeTriggered &&
            pr.level === "medium"
          ) {
            pr.needMoreTimeTriggered = true;
            const modal = document.getElementById("gentle-modal");
            if (modal) modal.classList.remove("hidden");
          }

          if (pr.timer <= 0) {
            clearInterval(pr.timerInterval);
            playSound("wrong");
            pr.currentIndex++;
            renderView();
          }
        }, 1000);
      }

      function addExtraTime() {
        state.practice.timer += 10;
        state.needMoreTimeTriggered = true;
        const modal = document.getElementById("gentle-modal");
        if (modal) modal.classList.add("hidden");
        startPracticeTimer();
      }

      function submitAnswer(chosen, correct) {
        if (state.practice.timerInterval)
          clearInterval(state.practice.timerInterval);

        if (chosen === correct) {
          playSound("correct");
          state.practice.correctCount++;
        } else {
          playSound("wrong");
        }

        state.practice.currentIndex++;
        renderView();
      }

              level: pr.level,

          state.profile.streak_days = data.streak_days;
          updateHeader();

          const container = document.getElementById("app-container");

                    </div>
                `;
        } catch (e) {
          setView("dashboard");

      function startWordGame() {
        const wg = state.wordGame;
        wg.currentIndex = 0;
        wg.correctCount = 0;
        loadNextWordGameRound();
        setView("wordgame");
      }

      function loadNextWordGameRound() {
        const wg = state.wordGame;
        const wordList =
          state.profile.dialect === "UK" ? wg.wordsUK : wg.wordsUS;
        if (wg.currentIndex >= wordList.length) {
          finishWordGame();
          return;
        }
        const currentItem = wordList[wg.currentIndex];
        wg.activeWord = currentItem.word;
        wg.hint = currentItem.hint;
        wg.guessedLetters = [];
        wg.wrongAttempts = 0;
        const pets = ["🐰", "🐱", "🐶", "🦊", "🐼", "🐨"];
        wg.currentPet = pets[Math.floor(Math.random() * pets.length)];
      }

      function renderWordGameScreen() {
        const wg = state.wordGame;
        const wordList =
          state.profile.dialect === "UK" ? wg.wordsUK : wg.wordsUS;

        if (wg.currentIndex >= wordList.length) {
          return `<div class="text-center"><h2 class="text-3xl font-bold text-yellow-300 animate-bounce">🎉 All Pets Rescued! Saving your stars...</h2></div>`;
        }

        let displayWordHTML = "";
        let wordComplete = true;
        for (let char of wg.activeWord) {
          if (wg.guessedLetters.includes(char)) {
            displayWordHTML += `<span class="w-12 h-14 bg-white/25 border-2 border-yellow-300 rounded-xl flex items-center justify-center text-3xl font-bold text-yellow-300 shadow">${char}</span>`;
          } else {
            displayWordHTML += `<span class="w-12 h-14 bg-white/10 border-2 border-white/30 rounded-xl flex items-center justify-center text-3xl font-bold text-white/50 shadow">_</span>`;
            wordComplete = false;
          }
        }

        if (wordComplete) {
          playSound("correct");
          wg.correctCount++;
          wg.currentIndex++;
          setTimeout(() => {
            loadNextWordGameRound();
            renderView();
          }, 1000);
          return `
                    <div class="bg-white/10 backdrop-blur-xl border border-white/20 p-8 rounded-3xl shadow-2xl max-w-lg w-full text-center flex flex-col gap-6 animate-fadeIn">
                        <span class="text-7xl animate-bounce">🎉📦🔓</span>

                        <p class="text-emerald-300 font-bold text-xl">+10 ⭐ Star Points Earned!</p>
                    </div>
                `;
        }

        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

        return `
                <div class="bg-white/10 backdrop-blur-xl border border-white/20 p-8 rounded-3xl shadow-2xl max-w-xl w-full flex flex-col items-center gap-6 relative">
                    <div class="w-full flex justify-between items-center text-sm font-semibold text-white/80">

                    </div>

                    <div class="relative bg-gradient-to-tr from-amber-800 to-amber-600 border-4 border-amber-400 w-36 h-36 rounded-3xl flex items-center justify-center shadow-2xl floating">
                        <div class="text-6xl">${wg.currentPet}</div>
                        <div class="absolute -top-3 bg-yellow-400 text-gray-900 px-3 py-0.5 rounded-full text-xs font-bold shadow">Locked Box 📦</div>
                    </div>

                    <p class="text-yellow-200 font-semibold text-lg text-center">Hint: ${wg.hint}</p>

                    <div class="flex gap-2 justify-center my-2">
                        ${displayWordHTML}
                    </div>

                    <div class="grid grid-cols-7 gap-2 w-full mt-2">
                        ${alphabet
                          .map((letter) => {
                            const guessed = wg.guessedLetters.includes(letter);
                            return `
                                <button onclick="guessLetter('${letter}')" ${guessed ? 'disabled class="bg-gray-700/50 text-gray-400 cursor-not-allowed"' : 'class="bg-white/20 hover:bg-white/30 border border-white/30 p-3 rounded-xl font-bold text-lg shadow active:scale-95 transition"'} >
                                    ${letter}
                                </button>
                            `;
                          })
                          .join("")}

                    <button onclick="setView('dashboard')" class="text-white/60 hover:text-white mt-2">⬅️ Back to Dashboard</button>
                </div>
            `;
      }

      function guessLetter(letter) {
        const wg = state.wordGame;
        if (wg.guessedLetters.includes(letter)) return;
        wg.guessedLetters.push(letter);

        const wordList =
          state.profile.dialect === "UK" ? wg.wordsUK : wg.wordsUS;
        const currentItem = wordList[wg.currentIndex];

        if (currentItem.word.includes(letter)) {
          playSound("correct");
        } else {
          playSound("wrong");
          wg.wrongAttempts++;
        }
        renderView();
      }

      async function saveStoryAPI() {
        const title = document.getElementById("story-title-input").value.trim();
        const theme = document.getElementById("story-theme-input").value;
        const content = document
          .getElementById("story-content-input")
          .value.trim();

        if (!title || !content) {
          alert("Please provide both a title and some story content!");
          return;
        }

        try {
          const res = await fetch("/api/stories/save", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              profile_id: state.activeProfileId,
              title,
              content,
              theme,
            }),
          });
          const data = await res.json();
          if (data.status === "success") {
            playSound("correct");
            selectProfile(state.activeProfileId);
            setView("stories");
          }
        } catch (e) {
          alert("Failed to save story");
        }

                                <div class="flex gap-2">
                                    ${
                                      item.unlocked
                                        ? `
                                        <button onclick="equipItem('${item.item_type}', '${item.item_id}')" class="bg-emerald-500 hover:bg-emerald-400 px-3 py-1.5 rounded-xl font-bold text-sm shadow">Equip</button>
                                    `
                                        : `
                                        <button onclick="buyItem('${item.item_id}')" class="bg-yellow-500 hover:bg-yellow-400 text-gray-900 px-3 py-1.5 rounded-xl font-bold text-sm shadow">Unlock</button>
                                    `
                                    }
                                </div>
                            </div>
                        `,
                          )
                          .join("")}
                    </div>
                </div>
            `;
      }

      async function buyItem(itemId) {
        try {
          const res = await fetch("/api/avatar/buy", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              profile_id: state.activeProfileId,
              item_id: itemId,
            }),
          });
          const data = await res.json();
          if (data.status === "success") {
            playSound("correct");
            selectProfile(state.activeProfileId);
          } else {
            alert(data.detail || "Not enough stars!");
          }
        } catch (e) {
          alert("Purchase failed");
        }
      }

      async function equipItem(slot, itemId) {
        try {
          const res = await fetch("/api/avatar/equip", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              profile_id: state.activeProfileId,
              slot,
              item_id: itemId,
            }),
          });
          const data = await res.json();
          if (data.status === "success") {
            playSound("click");
            state.profile.avatar_config = data.avatar_config;
            renderView();
          }
        } catch (e) {}
      }

      function renderWorldBuilderScreen() {
        return `
                <div class="bg-white/10 backdrop-blur-xl border border-white/20 p-6 rounded-3xl shadow-2xl max-w-3xl w-full flex flex-col gap-4 animate-fadeIn">
                    <div class="flex justify-between items-center">
                        <div>
                            <h2 class="text-2xl font-extrabold text-cyan-300">🏝️ Sunday World Builder</h2>
                            <p class="text-xs text-white/70">Place trees, houses, and cute pets in your virtual world!</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="clearWorld()" class="bg-red-500/30 hover:bg-red-500/50 border border-red-400 px-3 py-1.5 rounded-xl text-sm font-bold">Clear World</button>
                            <button onclick="setView('dashboard')" class="bg-white/20 px-4 py-1.5 rounded-xl text-sm font-bold hover:bg-white/30">⬅️ Back</button>
                        </div>
                    </div>

                    <div class="flex gap-3 bg-white/10 p-3 rounded-2xl justify-center items-center">
                        <span class="text-sm font-bold">Choose item to place:</span>
                        <button onclick="selectedWorldItem('tree')" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-xl text-xl">🌲 Tree</button>
                        <button onclick="selectedWorldItem('house')" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-xl text-xl">🏠 House</button>
                        <button onclick="selectedWorldItem('bunny')" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-xl text-xl">🐰 Bunny</button>
                        <button onclick="selectedWorldItem('flower')" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-xl text-xl">🌻 Flower</button>
                    </div>

                    <div id="world-grid" class="grid grid-cols-8 gap-2 bg-black/30 p-4 rounded-2xl border border-white/25 min-h-[350px]">
                        ${renderGridCells()}
                    </div>
                </div>
            `;
      }

      let currentWorldBrush = "tree";
      function selectedWorldItem(type) {
        currentWorldBrush = type;
        playSound("click");
      }

      function renderGridCells() {
        let html = "";
        for (let r = 0; r < 5; r++) {
          for (let c = 0; c < 8; c++) {
            const obj = state.world_objects.find((o) => o.x === c && o.y === r);
            let emoji = "";
            if (obj) {
              if (obj.item_type === "tree") emoji = "🌲";
              else if (obj.item_type === "house") emoji = "🏠";
              else if (obj.item_type === "bunny") emoji = "🐰";
              else if (obj.item_type === "flower") emoji = "🌻";
            }
            html += `<div onclick="placeWorldObject(${c}, ${r})" class="bg-white/10 hover:bg-white/25 border border-white/15 h-16 rounded-xl flex items-center justify-center text-3xl cursor-pointer transition">${emoji}</div>`;
          }
        }
        return html;
      }

      async function placeWorldObject(x, y) {
        try {
          playSound("click");
          const res = await fetch("/api/world/add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              item_type: currentWorldBrush,
              x,
              y,
              color: "default",
            }),
          });
          if (res.ok) selectProfile(state.activeProfileId);
        } catch (e) {}
      }

      async function clearWorld() {
        try {
          await fetch("/api/world/clear", { method: "DELETE" });
          selectProfile(state.activeProfileId);
        } catch (e) {}
      }

      function renderChallengeScreen() {
        return `
                <div class="bg-white/10 backdrop-blur-xl border border-white/20 p-8 rounded-3xl shadow-2xl max-w-lg w-full text-center flex flex-col gap-6 animate-fadeIn">
                    <span class="text-6xl animate-bounce">⚡</span>
                    <h2 class="text-3xl font-extrabold text-amber-300">Speed Challenge Mode</h2>
                    <p class="text-white/80">Answer 10 rapid-fire questions as fast as you can to earn double Star Points!</p>
                    <button onclick="beginPractice('hard', 10)" class="bg-gradient-to-r from-amber-500 to-orange-500 text-gray-900 font-extrabold py-4 rounded-2xl shadow-xl hover:scale-105 transition text-xl">Start Speed Challenge! 🔥</button>
                    <button onclick="setView('dashboard')" class="text-white/70 hover:text-white">⬅️ Back to Dashboard</button>
                </div>
            `;
      }

      function openSettingsModal() {
        const name = prompt("Update your explorer name:", state.profile.name);
        const yg = prompt(
          "Update your school year (2 to 6):",
          state.profile.year_group,
        );
        if (name && yg) updateProfileAPI(name.trim(), parseInt(yg));
      }

      async function updateProfileAPI(name, year_group) {
        try {
          await fetch(`/api/profile/${state.activeProfileId}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name,
              year_group,
              dialect: state.profile.dialect,
              theme_mode: state.profile.theme_mode,
              dyslexia_font: state.profile.dyslexia_font,
            }),
          });
          selectProfile(state.activeProfileId);
        } catch (e) {}
      }

      window.onload = () => {
        loadProfiles();
      };
    </script>
  </body>
</html>
