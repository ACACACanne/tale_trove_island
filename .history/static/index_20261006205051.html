<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Tale Trove Island: Multi-User SEND Learning</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Verdana&display=swap"
      rel="stylesheet"
    />
    <!-- External Stylesheet -->
    <link rel="stylesheet" href="/static/css/style.css" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Fredoka", "sans-serif"],
              dyslexia: ["Verdana", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body
    id="body-root"
    class="bg-gradient-to-br from-indigo-950 via-purple-950 to-pink-950 min-h-screen text-white font-sans flex flex-col items-center justify-between p-3 sm:p-6 select-none transition-colors duration-300"
  >
    <!-- Top Navigation Bar -->
    <header
      class="w-full max-w-4xl bg-white/10 backdrop-blur-md rounded-2xl p-3 sm:p-4 flex flex-wrap justify-between items-center gap-3 shadow-xl border border-white/20"
    >
      <div
        class="flex items-center gap-2 sm:gap-3 cursor-pointer"
        onclick="goToProfiles()"
      >
        <span class="text-2xl sm:text-3xl">🏝️</span>
        <div>
          <h1
            class="text-lg sm:text-xl font-bold tracking-wide bg-gradient-to-r from-yellow-300 via-pink-300 to-teal-300 bg-clip-text text-transparent"
          >
            Tale Trove Island
          </h1>
        </div>
      </div>
      <div class="flex items-center flex-wrap gap-2 sm:gap-3">
        <button
          onclick="goToProfiles()"
          class="bg-white/20 hover:bg-white/30 px-2.5 sm:px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1"
          title="Switch Explorer Profile"
        >
          👤
          <span
            id="current-user-badge"
            class="max-w-[80px] sm:max-w-[120px] truncate"
            >Select Profile</span
          >
        </button>
        <button
          onclick="openSendSettings()"
          class="bg-white/20 hover:bg-white/30 px-2.5 sm:px-3 py-1.5 rounded-full text-xs font-bold"
          title="SEND Settings"
        >
          🧠 SEND
        </button>
        <div
          class="bg-yellow-400/20 border border-yellow-400 px-2.5 sm:px-3 py-1 rounded-full flex items-center gap-1 text-yellow-300 font-bold text-xs sm:text-sm"
        >
          <span>⭐</span> <span id="header-stars">0</span>
        </div>
        <button
          onclick="toggleAudio()"
          id="audio-btn"
          class="bg-white/20 hover:bg-white/30 p-2 rounded-full text-base sm:text-lg transition"
          title="Toggle Music"
        >
          🎵
        </button>
      </div>
    </header>

    <!-- Main Content Dynamic Container -->
    <main
      id="app-container"
      class="w-full max-w-4xl my-4 sm:my-6 flex-1 flex flex-col items-center justify-center"
    >
      <!-- Injected via JavaScript Views -->
    </main>

    <!-- Footer Security & Privacy Badge -->
    <footer
      class="w-full max-w-4xl text-center text-[10px] sm:text-xs text-white/50 py-2 border-t border-white/10 flex flex-col sm:flex-row justify-between items-center gap-1"
    >
      <span>🔒 100% Local & Private (Multi-Classmate Profile Support)</span>
      <span id="dialect-footer-badge">Dialect: UK 🇬🇧</span>
    </footer>

    <!-- Modular JavaScript Scripts -->
    <script src="/static/js/state.js"></script>
    <script src="/static/js/audio.js"></script>
    <script src="/static/js/helpers.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/practice.js"></script>
    <script src="/static/js/views.js"></script>
    <script src="/static/js/app.js"></script>
  </body>
</html>
